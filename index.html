<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DPT Team Point Tracker</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg);
            color: var(--text);
            max-width: 900px; 
            margin: 0 auto; 
            padding: 2rem; 
        }
        
        .hidden { display: none !important; }
        
        .card { 
            background: var(--card-bg);
            border: 1px solid #e2e8f0; 
            padding: 1.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1rem; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .btn { 
            padding: 0.75rem 1.5rem; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600;
            cursor: pointer; 
            transition: background-color 0.2s;
        }
        
        .btn:hover { background: var(--primary-hover); }
        
        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover {
            background: var(--primary);
            color: white;
        }

        /* Checkbox Specific Styles */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin: 1.5rem 0;
            padding: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .checkbox-label:hover {
            background-color: #f1f5f9;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 1rem;
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        .team-card { text-align: center; }
        .score-display { 
            font-size: 4rem; 
            font-weight: 800; 
            margin: 1rem 0; 
            color: var(--primary);
        }
        .score-btn { 
            font-size: 1.5rem; 
            width: 50px; 
            height: 50px; 
            padding: 0;
            margin: 0 0.5rem;
            border-radius: 50%;
        }

        /* Logo Header */
        .header-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        .header-logo {
            width: 200px;
            max-width: 100%;
            height: auto;
            border-radius: 50%; /* Rounds out any hard edges if it's a square image */
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
    </style>
</head>
<body>
    <div class="header-container">
        <!-- Logo added here -->
        <img src="DaytonDPTLogo.png" alt="University of Dayton DPT Logo" class="header-logo">
        <h1 id="main-title">Scoreboard Setup</h1>
    </div>

    <!-- Phase 1: Team Selection -->
    <div id="phase-1" class="card">
        <h2>Select Competing Teams</h2>
        <p>Check the boxes for the teams participating in this session:</p>
        
        <div class="checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" value="Gem City Glutes" class="team-cb"> Gem City Glutes
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Flyer Flexors" class="team-cb"> Flyer Flexors
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Gait Keepers" class="team-cb"> Gait Keepers
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Rudy’s Rotators" class="team-cb"> Rudy’s Rotators
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Dayton Dorsiflexors" class="team-cb"> Dayton Dorsiflexors
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Proproceptive Pilots" class="team-cb"> Proproceptive Pilots
            </label>
        </div>

        <button class="btn" onclick="startTracking()">Create Scoreboard</button>
    </div>

    <!-- Phase 2: Active Scoreboard -->
    <div id="phase-2" class="hidden">
        <div id="scoreboard" class="grid"></div>
        <br>
        <div style="text-align: center;">
            <button class="btn btn-outline" onclick="resetApp()">Start Over (Clear Data)</button>
        </div>
    </div>

    <script>
        let teams = [];

        // Check for saved data when the page loads
        window.onload = function() {
            const savedTeams = localStorage.getItem('trackerTeams');
            if (savedTeams) {
                teams = JSON.parse(savedTeams);
                if (teams.length > 0) {
                    document.getElementById('phase-1').classList.add('hidden');
                    document.getElementById('phase-2').classList.remove('hidden');
                    document.getElementById('main-title').innerText = "Live Scoreboard";
                    renderScoreboard();
                }
            }
        };

        function startTracking() {
            // Find all checkboxes that are currently checked
            const checkboxes = document.querySelectorAll('.team-cb:checked');
            
            if (checkboxes.length === 0) {
                alert("Please select at least one team to start!");
                return;
            }

            teams = [];
            
            // Build the team array based on selected checkboxes
            checkboxes.forEach((cb, index) => {
                teams.push({ id: index, name: cb.value, score: 0 });
            });

            saveData();
            document.getElementById('phase-1').classList.add('hidden');
            document.getElementById('phase-2').classList.remove('hidden');
            document.getElementById('main-title').innerText = "Live Scoreboard";
            renderScoreboard();
        }

        function updateScore(index, change) {
            // Scores can now go into the negatives because the zero-limit check was removed
            teams[index].score += change;
            
            saveData();
            renderScoreboard();
        }

        function renderScoreboard() {
            const board = document.getElementById('scoreboard');
            board.innerHTML = '';

            teams.forEach((team, index) => {
                board.innerHTML += `
                    <div class="card team-card">
                        <h3>${team.name}</h3>
                        <div class="score-display">${team.score}</div>
                        <div>
                            <button class="btn btn-outline score-btn" onclick="updateScore(${index}, -1)">-1</button>
                            <button class="btn score-btn" onclick="updateScore(${index}, 1)">+1</button>
                        </div>
                    </div>
                `;
            });
        }

        function saveData() {
            localStorage.setItem('trackerTeams', JSON.stringify(teams));
        }

        function resetApp() {
            if(confirm("Are you sure you want to reset all scores and return to setup? This cannot be undone.")) {
                localStorage.removeItem('trackerTeams');
                teams = [];
                
                // Uncheck all boxes visually
                document.querySelectorAll('.team-cb').forEach(cb => cb.checked = false);
                
                document.getElementById('phase-2').classList.add('hidden');
                document.getElementById('phase-1').classList.remove('hidden');
                document.getElementById('main-title').innerText = "Scoreboard Setup";
            }
        }
    </script>
</body>
</html>
