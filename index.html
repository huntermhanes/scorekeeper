<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UD DPT CO2028 SUMMER OLYMPICS</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --yellow-card: #eab308;
            --red-card: #ef4444;
            --stop-btn: #ef4444;
            --start-btn: #10b981;
        }
        
        body { 
            font-family: system-ui, -apple-system, sans-serif; 
            background-color: var(--bg);
            color: var(--text);
            max-width: 1000px; 
            margin: 0 auto; 
            padding: 2rem; 
        }
        
        .hidden { display: none !important; }
        
        .card { 
            background: var(--card-bg);
            border: 1px solid #e2e8f0; 
            padding: 1.5rem; 
            border-radius: 12px; 
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 1.5rem; 
        }
        
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); 
            gap: 1.5rem; 
        }
        
        .btn { 
            padding: 0.75rem 1.5rem; 
            background: var(--primary); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600;
            cursor: pointer; 
            transition: opacity 0.2s;
        }
        
        .btn:hover:not(:disabled) { opacity: 0.85; }
        
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }
        
        .btn-outline:hover:not(:disabled) {
            background: var(--primary);
            color: white;
        }

        /* Penalty Card Buttons */
        .btn-yellow {
            background: var(--yellow-card);
            color: #000;
            width: 100%;
            margin-bottom: 0.5rem;
        }
        .btn-red {
            background: var(--red-card);
            color: white;
            width: 100%;
        }

        select, input[type="text"] {
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            width: 100%;
            max-width: 450px;
        }
        
        select { cursor: pointer; }
        
        select:disabled {
            background-color: #f1f5f9;
            cursor: not-allowed;
        }

        /* Checkbox Specific Styles */
        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.85rem;
            margin: 1.5rem 0;
            padding: 0.5rem;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            font-weight: 500;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }

        .checkbox-label:hover {
            background-color: #f1f5f9;
        }

        .checkbox-label input[type="checkbox"] {
            margin-right: 1rem;
            width: 1.25rem;
            height: 1.25rem;
            cursor: pointer;
            accent-color: var(--primary);
        }
        
        /* Scoreboard Specifics */
        .team-card { text-align: center; }
        .score-display { 
            font-size: 4rem; 
            font-weight: 800; 
            margin: 0.5rem 0; 
            color: var(--primary);
        }
        .total-display {
            font-size: 1.25rem;
            font-weight: 700;
            color: #334155;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid #e2e8f0;
        }
        .score-btn { 
            font-size: 1.5rem; 
            width: 50px; 
            height: 50px; 
            padding: 0;
            margin: 0 0.5rem 1rem 0.5rem;
            border-radius: 50%;
        }

        /* Logo Header */
        .header-container {
            text-align: center;
            margin-bottom: 2rem;
        }
        .header-logo {
            width: 200px;
            max-width: 100%;
            height: auto;
            border-radius: 50%;
            margin-bottom: 1rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }

        .event-controller {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
        }

        .leaderboard-list {
            list-style: none;
            padding: 0;
        }
        
        .leaderboard-list li {
            font-size: 1.1rem;
            padding: 0.5rem 0;
            border-bottom: 1px solid #f1f5f9;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .history-list {
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        .history-list li {
            margin-bottom: 0.5rem;
        }
        
        .active-event-text {
            color: var(--start-btn);
            font-weight: bold;
            margin-top: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="header-container">
        <img src="DaytonDPTLogo.png" alt="University of Dayton DPT Logo" class="header-logo">
        <h1 id="main-title">UD DPT CO2028 SUMMER OLYMPICS: Scoreboard Setup</h1>
    </div>

    <!-- Phase 1: Team Selection -->
    <div id="phase-1" class="card">
        <h2>Select Competing Teams</h2>
        <p>Check the boxes for the teams participating in this session:</p>
        
        <div class="checkbox-group" id="team-checkbox-group">
            <label class="checkbox-label">
                <input type="checkbox" value="Gem City Glutes" class="team-cb"> Gem City Glutes
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Flyer Flexors" class="team-cb"> Flyer Flexors
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Gait Keepers" class="team-cb"> Gait Keepers
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Rudy’s Rotators" class="team-cb"> Rudy’s Rotators
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Dayton Dorsiflexors" class="team-cb"> Dayton Dorsiflexors
            </label>
            <label class="checkbox-label">
                <input type="checkbox" value="Proproceptive Pilots" class="team-cb"> Proprioceptive Pilots
            </label>
        </div>

        <!-- Add Custom Team Section -->
        <div style="margin-bottom: 1.5rem; padding-top: 1rem; border-top: 1px solid #e2e8f0;">
            <p style="margin-top: 0; margin-bottom: 0.5rem; font-weight: 500;">Need to add another team?</p>
            <div style="display: flex; gap: 0.5rem; align-items: center;">
                <input type="text" id="custom-team-input" placeholder="Enter new team name" style="margin: 0; max-width: 300px;">
                <button class="btn btn-outline" onclick="addCustomTeam()" style="padding: 0.75rem 1rem;">Add Team</button>
            </div>
        </div>

        <button class="btn" onclick="startTracking()">Create Scoreboard</button>
    </div>

    <!-- Phase 2: Active Scoreboard -->
    <div id="phase-2" class="hidden">
        
        <!-- Event Saving Controls -->
        <div class="card" style="background-color: #f8fafc; border: 2px solid #cbd5e1;">
            <h3>Current Event Manager</h3>
            <div class="event-controller">
                <select id="event-select">
                    <optgroup label="WARM UP">
                        <option value="Balance - Romberg Test Royal">Balance - Romberg Test Royal</option>
                        <option value="Pool noodle javelin - Scapular Mechanics Fling">Pool noodle javelin - Scapular Mechanics Fling</option>
                        <option value="Tennis ball search pick - Geriatric Search Party">Tennis ball search pick - Geriatric Search Party</option>
                        <option value="Plank and pass - Make the Rectus Abdominis Great Again">Plank and pass - Make the Rectus Abdominis Great Again</option>
                    </optgroup>
                    <optgroup label="TEAM EVENTS">
                        <option value="3 legged relay - Wide BOS">3 legged relay - Wide BOS</option>
                        <option value="Crab walk/bearcrawl/wheelbarrel - Maturation Proximal Stability Milestones">Crab walk/bearcrawl/wheelbarrel - Maturation Proximal Stability Milestones</option>
                        <option value="Swiss ball relay - Splenius Capitis Push">Swiss ball relay - Splenius Capitis Push</option>
                        <option value="Dizzy bat soccer - Vestibular Disequilibrium soccer">Dizzy bat soccer - Vestibular Disequilibrium soccer</option>
                        <option value="Water transfer - Whirlpool Dash">Water transfer - Whirlpool Dash</option>
                        <option value="Volleyball - Rotator Cuff Rally">Volleyball - Rotator Cuff Rally</option>
                    </optgroup>
                    <optgroup label="FINAL EVENTS">
                        <option value="Grab cup - Muscle Spindle reaction">Grab cup - Muscle Spindle reaction</option>
                        <option value="Oreo - Frontalis to Orbicularis Oris Oreo Pass">Oreo - Frontalis to Orbicularis Oris Oreo Pass</option>
                        <option value="Spelling bee - The Charting Challenge">Spelling bee - The Charting Challenge</option>
                        <option value="SKIT - SOAP Opera">SKIT - SOAP Opera</option>
                    </optgroup>
                </select>

                <button id="start-event-btn" class="btn" onclick="startCurrentEvent()" style="background-color: var(--start-btn);">Start Event</button>
                <button id="stop-event-btn" class="btn hidden" onclick="stopCurrentEvent()" style="background-color: var(--stop-btn);">Stop Event & Save Totals</button>
            </div>
            <p id="event-status-text" style="font-size: 0.85rem; color: #64748b; margin-top: 0.5rem;">Select an event and click Start to unlock scoring.</p>
        </div>

        <!-- The Team Grid -->
        <div id="scoreboard" class="grid"></div>
        
        <!-- History & Standings -->
        <div class="card" style="margin-top: 2rem;">
            <h2>Grand Totals & Event History</h2>
            <div id="history-content"></div>
        </div>

        <br>
        <div style="text-align: center;">
            <button class="btn btn-outline" onclick="resetApp()">Start Over (Erase All Data)</button>
        </div>
    </div>

    <script>
        let teams = []; 
        let eventHistory = []; 
        let isEventActive = false;
        let savedDropdownIndex = 0;

        window.onload = function() {
            const savedData = localStorage.getItem('dptTrackerData');
            if (savedData) {
                const parsed = JSON.parse(savedData);
                teams = parsed.teams || [];
                eventHistory = parsed.eventHistory || [];
                isEventActive = parsed.isEventActive || false;
                savedDropdownIndex = parsed.savedDropdownIndex || 0;
                
                if (teams.length > 0) {
                    document.getElementById('phase-1').classList.add('hidden');
                    document.getElementById('phase-2').classList.remove('hidden');
                    document.getElementById('main-title').innerText = "UD DPT CO2028 SUMMER OLYMPICS: Live Scoreboard";
                    
                    document.getElementById('event-select').selectedIndex = savedDropdownIndex;
                    updateEventUI();
                    renderScoreboard();
                }
            }
        };

        function addCustomTeam() {
            const input = document.getElementById('custom-team-input');
            const teamName = input.value.trim();

            if (!teamName) {
                alert("Please enter a team name.");
                return;
            }

            const checkboxGroup = document.getElementById('team-checkbox-group');
            
            const label = document.createElement('label');
            label.className = 'checkbox-label custom-added-team';
            
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = teamName;
            checkbox.className = 'team-cb';
            checkbox.checked = true; 

            label.appendChild(checkbox);
            label.appendChild(document.createTextNode(' ' + teamName));

            checkboxGroup.appendChild(label);
            input.value = '';
        }

        function startTracking() {
            const checkboxes = document.querySelectorAll('.team-cb:checked');
            
            if (checkboxes.length === 0) {
                alert("Please select at least one team to start!");
                return;
            }

            teams = [];
            eventHistory = [];
            isEventActive = false;
            savedDropdownIndex = 0;
            
            checkboxes.forEach((cb, index) => {
                teams.push({ id: index, name: cb.value, currentScore: 0, totalScore: 0 });
            });

            document.getElementById('event-select').selectedIndex = 0;

            saveData();
            document.getElementById('phase-1').classList.add('hidden');
            document.getElementById('phase-2').classList.remove('hidden');
            document.getElementById('main-title').innerText = "UD DPT CO2028 SUMMER OLYMPICS: Live Scoreboard";
            updateEventUI();
            renderScoreboard();
        }

        function startCurrentEvent() {
            isEventActive = true;
            savedDropdownIndex = document.getElementById('event-select').selectedIndex;
            saveData();
            updateEventUI();
            renderScoreboard();
        }

        function stopCurrentEvent() {
            if(!confirm("Are you sure you want to stop this event? This will lock in scores and add them to the Grand Total.")) {
                return;
            }

            const selectEl = document.getElementById('event-select');
            const eventName = selectEl.options[selectEl.selectedIndex].value;

            let record = { name: eventName, scores: {} };

            teams.forEach(team => {
                record.scores[team.name] = team.currentScore;
                team.totalScore += team.currentScore; 
                team.currentScore = 0; 
            });

            eventHistory.push(record);
            
            isEventActive = false;
            
            if (selectEl.selectedIndex < selectEl.options.length - 1) {
                selectEl.selectedIndex++;
                savedDropdownIndex = selectEl.selectedIndex;
            }
            
            saveData();
            updateEventUI();
            renderScoreboard();
        }

        function updateEventUI() {
            const startBtn = document.getElementById('start-event-btn');
            const stopBtn = document.getElementById('stop-event-btn');
            const selectEl = document.getElementById('event-select');
            const statusText = document.getElementById('event-status-text');

            if (isEventActive) {
                startBtn.classList.add('hidden');
                stopBtn.classList.remove('hidden');
                selectEl.disabled = true;
                statusText.innerHTML = "🟢 <span class='active-event-text'>Event Active: Scoring is unlocked!</span>";
            } else {
                startBtn.classList.remove('hidden');
                stopBtn.classList.add('hidden');
                selectEl.disabled = false;
                statusText.innerHTML = "Select an event and click Start to unlock scoring.";
            }
        }

        function updateScore(index, change) {
            if (!isEventActive) return; 

            teams[index].currentScore += change;
            saveData();
            renderScoreboard();
        }

        function editGrandTotal(teamName) {
            const team = teams.find(t => t.name === teamName);
            if (!team) return;

            const input = prompt(`Enter corrected grand total score for ${team.name}:`, team.totalScore);
            if (input !== null) {
                const newScore = parseInt(input);
                if (!isNaN(newScore)) {
                    team.totalScore = newScore;
                    saveData();
                    renderScoreboard();
                } else {
                    alert("Please enter a valid number.");
                }
            }
        }

        function renderScoreboard() {
            const board = document.getElementById('scoreboard');
            board.innerHTML = '';

            const disabledState = isEventActive ? '' : 'disabled';

            teams.forEach((team, index) => {
                board.innerHTML += `
                    <div class="card team-card">
                        <h3 style="margin-bottom: 0.2rem;">${team.name}</h3>
                        
                        <p style="margin: 0; color: #64748b; font-size: 0.9rem;">Current Event Score</p>
                        <div class="score-display">${team.currentScore}</div>
                        <div class="total-display">Overall Total: ${team.totalScore}</div>
                        
                        <div>
                            <button class="btn btn-outline score-btn" onclick="updateScore(${index}, -1)" ${disabledState}>-1</button>
                            <button class="btn score-btn" onclick="updateScore(${index}, 1)" ${disabledState}>+1</button>
                        </div>
                        
                        <div style="margin-top: 1rem; padding-top: 1rem; border-top: 1px solid #f1f5f9;">
                            <button class="btn btn-yellow" onclick="updateScore(${index}, -1)" ${disabledState}>🟨 Yellow Card (-1)</button>
                            <button class="btn btn-red" onclick="updateScore(${index}, -3)" ${disabledState}>🟥 Red Card (-3)</button>
                        </div>
                    </div>
                `;
            });

            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('history-content');
            
            let sortedTeams = [...teams].sort((a, b) => b.totalScore - a.totalScore);
            
            let html = `<h3>🏆 Current Standings</h3><ul class="leaderboard-list">`;
            sortedTeams.forEach(t => {
                html += `<li>
                    <span><strong>${t.name}:</strong> ${t.totalScore} pts</span>
                    <button class="btn btn-outline" style="padding: 0.25rem 0.6rem; font-size: 0.85rem;" onclick="editGrandTotal('${t.name}')">Edit Total</button>
                </li>`;
            });
            html += `</ul>`;

            if (eventHistory.length > 0) {
                html += `<h3 style="margin-top: 1.5rem;">📋 Past Events</h3><ul class="history-list">`;
                [...eventHistory].reverse().forEach(ev => {
                    let teamStrs = [];
                    teams.forEach(t => {
                        teamStrs.push(`${t.name} (${ev.scores[t.name]})`);
                    });
                    html += `<li><strong>${ev.name}</strong>: ${teamStrs.join(' | ')}</li>`;
                });
                html += `</ul>`;
            } else {
                html += `<p style="color: #64748b; font-size: 0.9rem;">No events have been saved yet.</p>`;
            }

            container.innerHTML = html;
        }

        function saveData() {
            const dataToSave = {
                teams: teams,
                eventHistory: eventHistory,
                isEventActive: isEventActive,
                savedDropdownIndex: savedDropdownIndex
            };
            localStorage.setItem('dptTrackerData', JSON.stringify(dataToSave));
        }

        function resetApp() {
            if(confirm("Are you sure you want to completely erase ALL scores, history, and teams? This cannot be undone.")) {
                localStorage.removeItem('dptTrackerData');
                teams = [];
                eventHistory = [];
                isEventActive = false;
                savedDropdownIndex = 0;
                
                document.querySelectorAll('.team-cb').forEach(cb => cb.checked = false);
                document.querySelectorAll('.custom-added-team').forEach(el => el.remove());
                
                document.getElementById('phase-2').classList.add('hidden');
                document.getElementById('phase-1').classList.remove('hidden');
                document.getElementById('main-title').innerText = "UD DPT CO2028 SUMMER OLYMPICS: Scoreboard Setup";
            }
        }
    </script>
</body>
</html>
